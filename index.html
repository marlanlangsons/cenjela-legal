<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cenjela Legal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b1638 0%, #1c1248 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 32px;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
    }

    p {
      color: #d6d9e8;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    a {
      display: block;
      text-decoration: none;
      color: #0b1638;
      background: #21d4b4;
      padding: 16px 18px;
      border-radius: 14px;
      font-weight: 700;
      text-align: center;
    }

    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: #aeb5cc;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Cenjela</h1>
    <p>
      Legal information for the Cenjela business management application.
    </p>

    <div class="links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </div>

    <div class="footer">
      Cenjela — Your business, understood.
    </div>
  </main>
</body>
